<template>
    <div class="slds-grid slds-wrap slds-gutters slds-m-horizontal_xx-large ">
        <template for:each={college} for:item="clg">
        <div class="slds-col slds-size_1-of-3 slds-p-around_medium"  key={clg.Id}>
            <lightning-layout-item size="12" small-device-size="6" medium-device-size="4" large-device-size="3">
            
                <lightning-card>
                <h1 slot="title" class="no-wrap">{clg.Name}</h1>
                <p class="slds-m-left_large">{clg.City__c}</p>
                <p class="slds-m-left_large">{clg.State__c}</p>
                <p class="slds-m-left_large">{clg.Country__c}</p>

               <lightning-button 
               data-cid={clg.Id} 
               label="More Info" 
               slot="actions"
                variant="destructive" 
                onclick={navigateCourse}></lightning-button> 
            </lightning-card>
            
        </lightning-layout-item>
        </div>
        </template>
    </div>
</template>
