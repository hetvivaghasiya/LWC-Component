<template>
    <!-- Tab Navigation -->
    <!-- <div class="slds-tabs_default custom-tab-container"> -->
        <ul class="slds-tabs_default__nav" role="tablist">
            <li class="slds-tabs_default__item" role="presentation">
                <a href="javascript:void(0);" 
                   class="slds-tabs_default__link custom-tab {profileTabClass}" 
                   data-id="profile" 
                   onclick={handleTabClick}>
                   <lightning-icon icon-name="utility:education" size="small" class="tab-icon"></lightning-icon>
                    Faculty
                </a>
            </li>
            <li class="slds-tabs_default__item" role="presentation">
                <a href="javascript:void(0);" 
                   class="slds-tabs_default__link custom-tab {documentTabClass}" 
                   data-id="document" 
                   onclick={handleTabClick}>
                   <lightning-icon icon-name="utility:topic" size="small" class="tab-icon"></lightning-icon>
                    Subjects
                </a>
            </li>
           
        </ul>

        <!-- Tab Content -->
        <!-- <div class="slds-tabs_default__content custom-tab-content"> -->
            <template if:true={isProfileActive}>
                <!-- Profile Section -->
                <div class="slds-box slds-box_xx-small custom-box">
                    <c-faculty-card></c-faculty-card>
                </div>
            </template>
            <template if:true={isDocumentActive}>
                <!-- Document Section -->
                <div class="slds-box slds-box_xx-small custom-box">
                   <c-subject-card-section></c-subject-card-section>
                </div>
            </template>
           
        <!-- </div> -->
    <!-- </div> -->
</template>
