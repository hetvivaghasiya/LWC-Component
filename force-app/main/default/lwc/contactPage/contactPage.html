<template>
    <div class="container">
        <h2>Contact Us</h2>
        <p>Have questions? Fill out the form below and we'll get back to you.</p>

        <div class="contact-wrapper">
            <!-- Contact Form -->
            <div class="contact-form">
                <form onsubmit={handleSubmit}>
                    <input type="text" name="name" placeholder="Your Name" required>
                    <input type="email" name="email" placeholder="Your Email" required>
                    <input type="text" name="subject" placeholder="Subject" required>
                    <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
                    <button type="submit">Send Message</button>
                </form>
                <!-- Success Message Box -->
                <template if:true={showMessage}>
                    <div class="success-box">
                        <lightning-icon icon-name="utility:success" alternative-text="Success" size="small" class="icon"></lightning-icon>
                        <p class="message-text">Your message has been sent successfully!</p>
                    </div>
                </template>
            </div>

            <!-- Contact Info -->
            <div class="contact-info">
                <h3>Contact Information</h3>
                <p><i class="fas fa-map-marker-alt"></i> 123 Main Street, Your City, Country</p>
                <p><i class="fas fa-phone"></i> +1 234 567 890</p>
                <p><i class="fas fa-envelope"></i> contact@example.com</p>
                <p><i class="fas fa-clock"></i> Mon - Fri: 9:00 AM - 6:00 PM</p>
            </div>
        </div>
    </div>
</template>
