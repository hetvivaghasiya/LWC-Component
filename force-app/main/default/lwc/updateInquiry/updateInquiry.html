<template>
    <lightning-card record-id={leadId} >
        <div class="form-container">
            <lightning-input label="First Name" name="firstName" value={firstName} onchange={handleInputChange} required></lightning-input>

            <lightning-input label="Middle Name" name="middleName" value={middleName} onchange={handleInputChange} required></lightning-input>

            <lightning-input label="Last Name" name="lastName" value={lastName} onchange={handleInputChange} required></lightning-input>

            <lightning-input label="Email" name="email" value={email} onchange={handleInputChange} type="email" required></lightning-input>

            <lightning-input label="Phone" name="phone" value={phone} onchange={handleInputChange} type="tel" required></lightning-input>

            <lightning-combobox label="Gender" name="gender" value={gender} onchange={handleInputChange} options={genderOptions} required></lightning-combobox>

            <lightning-input label="Street" name="street" value={street} onchange={handleInputChange} required></lightning-input>

            <lightning-input label="City" name="city" value={city} onchange={handleInputChange} required></lightning-input>

            <lightning-input label="Country" name="country" value={country} onchange={handleInputChange} required></lightning-input>

            <lightning-input label="State" name="state" value={state} onchange={handleInputChange} required></lightning-input>

            <lightning-input label="10th Pass Year" name="xpy" value={xpy} onchange={handleInputChange} required></lightning-input>

            <lightning-input label="10th Percentage" name="xper" value={xper} onchange={handleInputChange} required></lightning-input>

            <lightning-input label="12th Pass Year" name="xipy" value={xipy} onchange={handleInputChange} required></lightning-input>

            <lightning-input label="12th Percentage" name="xiper" value={xiper} onchange={handleInputChange} required></lightning-input>

            <div class="button-container">
                <button class="update-button" onclick={handleUpdate}>Update</button>
            </div>
        </div>
    </lightning-card>
</template>
